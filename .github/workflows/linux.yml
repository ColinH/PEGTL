name: Linux

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-26.04
            compiler: g++-15
          - os: ubuntu-26.04
            compiler: g++-16
          - os: ubuntu-24.04
            compiler: clang++-18
          - os: ubuntu-26.04
            compiler: clang++-21
          - os: ubuntu-26.04
            compiler: clang++-22
        build_type: [Release, Debug]
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Install Dependencies
        env:
          compiler: ${{ matrix.platform.compiler }}
        run: |
          set -x
          sudo apt -qq update
          sudo apt -qq install -y ninja-build --no-install-recommends --no-install-suggests
          if [[ "${compiler}" = g++-16 ]]; then
            sudo apt -qq install -y g++-16 --no-install-recommends --no-install-suggests
          fi

      - uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake -S . -B build \
          -GNinja \
          -DCMAKE_CXX_COMPILER=${{ matrix.platform.compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DPEGTL_BUILD_LINT=ON

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
