name: clang-analyze

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  clang-analyze:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
          sudo tee /usr/share/keyrings/llvm-archive-keyring.asc > /dev/null
        echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main' |
          sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
        sudo apt-get -qq update -yq
        sudo apt-get -qq install -y clang-23 clang-tools-23 --no-install-recommends --no-install-suggests

    - name: Show analyzer version
      run: clang-23 --version

    - run: scan-build-23 --use-analyzer=/usr/bin/clang-23 cmake -S . -B build -GNinja

    - run: scan-build-23 --use-analyzer=/usr/bin/clang-23 --status-bugs -o build/analyzer-reports cmake --build build

    - name: Upload analyzer reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clang-analyzer-reports
        path: build/analyzer-reports
        if-no-files-found: ignore
