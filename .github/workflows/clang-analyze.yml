name: clang-analyze

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'doc/**'

permissions:
  contents: read

jobs:
  clang-analyze:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Install Dependencies
      run: |
        sudo apt-get -qq update -yq
        sudo apt-get -qq install -y clang-22 clang-tools-22 --no-install-recommends --no-install-suggests

    - name: Show analyzer version
      run: clang-22 --version

    - run: scan-build-22 --use-analyzer=/usr/bin/clang-22 cmake -S . -B build -GNinja

    - run: scan-build-22 --use-analyzer=/usr/bin/clang-22 --status-bugs -o build/analyzer-reports cmake --build build

    - name: Upload analyzer reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: clang-analyzer-reports
        path: build/analyzer-reports
        if-no-files-found: ignore
